[package]
name = "chronoloop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Deterministic simulation engine for infrastructure control loops — virtual time, replayable history, shrinkable failures"
repository = "https://github.com/ngaddam369/chronoloop"
license = "Apache-2.0"
readme = "README.md"
keywords = ["simulation", "deterministic", "testing", "distributed-systems", "replay"]
categories = ["development-tools::testing", "simulation"]

# `harness = false` means this target is a plain program, so anything that runs it runs the whole
# benchmark. `test = false` keeps a bare `cargo test` away from it; `--all-targets` selects benches
# explicitly and ignores that, which is why the test commands name their targets instead.
[[bench]]
name = "simulation"
harness = false
test = false

[dependencies]
# `default-features = false` keeps out the colour machinery (anstream, anstyle-*) and the
# did-you-mean suggestions (strsim), neither of which a CLI of six subcommands needs. The features left
# are the ones that make a mistyped invocation say so: argument parsing, help, usage and context.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

# `default-features = false` drops os_rng, thread_rng and std_rng, so getrandom is never compiled
# in and OS entropy cannot reach a simulation even by accident. The seed is the only entropy there is.
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }

# `default-features = false` drops the `std` feature, which only adds an `io::Write` impl this crate
# has no use for; `pure` selects the portable Rust implementation over the assembly one, which takes
# a C compiler, `cc`, `libc` and runtime CPU detection out of the build. This crate hashes small
# state trees rather than gigabytes, so the throughput that buys is worth none of it.
blake3 = { version = "1", default-features = false, features = ["pure"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Allow-list: pedantic lints that fight this codebase rather than improve it.
# Keep this list short and justified — widening it silently defeats the point.
module_name_repetitions = "allow" # clock::VirtualClock reads better than clock::Virtual
missing_errors_doc = "allow"      # re-enable once the error taxonomy settles
must_use_candidate = "allow"      # would demand #[must_use] on nearly every constructor
